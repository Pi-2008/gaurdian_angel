<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian Angel</title>
<style>
  :root {
    --bg: #f7f8fa;
    --text: #14181f;
    --muted: #5b6573;
    --card: #ffffff;
    --border: #dfe3e8;
    --accent: #1f4e8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b;
      --text: #f1f3f6;
      --muted: #9aa4b2;
      --card: #1a2029;
      --border: #2b3340;
      --accent: #7fb0ee;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 2rem; margin: 0 0 6px; text-align: center; letter-spacing: -0.5px; }
  .tag { text-align: center; color: var(--muted); margin: 0 0 36px; font-size: 1.05rem; }
  .btn {
    display: block;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 24px 22px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
  }
  .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
  .btn strong { display: block; font-size: 1.3rem; margin-bottom: 4px; }
  .btn span { color: var(--muted); font-size: 1rem; }
  .sos {
    text-align: center;
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .sos a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Guardian Angel</h1>
  <p class="tag">You are not alone.</p>

  <a class="btn" href="face-generator.html">
    <strong>Rekhachitram</strong>
    <span>Face generator</span>
  </a>

  <a class="btn" href="traveller_tracker.html">
    <strong>Travel Route</strong>
    <span>Track and share your journey</span>
  </a>

  <p class="sos">In immediate danger? Call emergency services: <a href="tel:112">112</a></p>
</main>
</body>
</html>
